x-resource-defaults: &default-resources
  limits:
    cpus: "0.50"
    memory: 256M

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatekeeper}
      POSTGRES_USER: ${POSTGRES_USER:-gatekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatekeeper} -d ${POSTGRES_DB:-gatekeeper}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources: *default-resources

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources: *default-resources

  healthy-service:
    build:
      context: .
      dockerfile: demo_upstreams/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_MODULE: healthy_service
      PORT: "9001"
    networks: [data]
    deploy:
      resources: *default-resources

  slow-service:
    build:
      context: .
      dockerfile: demo_upstreams/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_MODULE: slow_service
      PORT: "9002"
      SLOW_SERVICE_DEFAULT_DELAY_SECONDS: "3.0"
    networks: [data]
    deploy:
      resources: *default-resources

  flaky-service:
    build:
      context: .
      dockerfile: demo_upstreams/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_MODULE: flaky_service
      PORT: "9003"
      FLAKY_FAILURE_EVERY_N: "3"
    networks: [data]
    deploy:
      resources: *default-resources

  gatekeeper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      GATEKEEPER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gatekeeper}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gatekeeper}
      GATEKEEPER_REDIS_URL: redis://redis:6379/0
      GATEKEEPER_ROUTES_CONFIG: /app/config/routes.yaml
      GATEKEEPER_POLICIES_CONFIG: /app/config/policies.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      healthy-service:
        condition: service_started
      slow-service:
        condition: service_started
      flaky-service:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    networks: [data, edge]
    deploy:
      resources: *default-resources

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gatekeeper
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge]
    deploy:
      resources: *default-resources

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - gatekeeper
    ports:
      - "127.0.0.1:9090:9090"
    networks: [edge]
    deploy:
      resources: *default-resources

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    networks: [edge]
    deploy:
      resources: *default-resources

networks:
  # gatekeeper <-> redis/postgres/demo-upstreams. No ports are published for
  # anything on this network, so those dependencies are unreachable from
  # the host or outside the Compose project -- only the gateway talks to
  # them, by service name, over Docker's internal DNS.
  data:
    internal: true
  # gatekeeper <-> nginx/prometheus/grafana. These are the pieces meant to
  # be reachable (via the explicit 127.0.0.1-bound ports above).
  edge:

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
