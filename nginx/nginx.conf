# Minimal edge-reverse-proxy demonstration.
#
# In a real deployment, Nginx (or an equivalent L7 load balancer) usually
# sits in front of the gateway to terminate TLS, absorb slow/abusive
# connections at the network edge, and load-balance across gateway
# replicas. Gatekeeper's own rate limiting/auth/circuit-breaking still
# happens one layer in, in the FastAPI app -- Nginx here only demonstrates
# that topology; it intentionally does not duplicate gateway policy.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;

    # Bound how long Nginx will wait on slow clients/backends, and cap
    # request body size at the edge as a first line of defense (the
    # gateway enforces its own, authoritative limit as well).
    client_max_body_size 3m;
    client_body_timeout 10s;
    send_timeout 10s;

    upstream gatekeeper_upstream {
        server gatekeeper:8000;
    }

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://gatekeeper_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
